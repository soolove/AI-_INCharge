# ns-3 CI/CD script with the code-linting stage
#
# Contains jobs to check the ns-3 coding style and perform lint checking.

# REUSE license checking
reuse:
  stage: code-linting
  image:
    name: fsfe/reuse:latest
    entrypoint: [""]
  script:
    - reuse lint

# Clang-format
check-style-clang-format:
  stage: code-linting
  image: alpine:latest
  before_script:
    - apk update
    - apk add git python3
    - python3 -m venv .venv
    - source ./.venv/bin/activate
    - pip install clang-format==20.1.0
  script:
    - git clone -b $NS3_RELEASE_VERSION --depth=1 $NS3_REPOSITORY_URL
    - ln -s ${PWD} ns-3-dev/contrib/nr
    - cd ns-3-dev
    - python3 utils/check-style-clang-format.py contrib/nr/model
    - python3 utils/check-style-clang-format.py contrib/nr/helper
    - python3 utils/check-style-clang-format.py contrib/nr/utils
    - python3 utils/check-style-clang-format.py contrib/nr/examples
    - python3 utils/check-style-clang-format.py contrib/nr/test
    - python3 utils/check-style-clang-format.py --no-formatting contrib/nr/doc
    - python3 utils/check-style-clang-format.py --no-formatting contrib/nr/tutorial
    - cd ../
    - rm -rf ns-3-dev
  timeout: 1h

# Check cmake format
cmake-format:
  stage: code-linting
  image: alpine:latest
  rules:
    # Always run when a pipeline is started manually from the web UI.
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # Otherwise only run when CMake files change.
    - changes:
        - "**/CMakeLists.txt"
        - "**/*.cmake"
  before_script:
    - apk update
    - apk add git python3 g++
    - python3 -m venv .venv
    - source ./.venv/bin/activate
    - pip install pyyaml cmake cmake-format ninja
  script:
    - git clone -b $NS3_RELEASE_VERSION --depth=1 $NS3_REPOSITORY_URL
    - mkdir -p ns-3-dev/contrib/nr/
    - ln -s ${PWD} ns-3-dev/contrib/nr
    - cd ns-3-dev
    - ./ns3 configure --enable-modules=core
    - ./ns3 build cmake-format-check
    - cd ../
    - rm -rf ns-3-dev
  timeout: 1h

# Check Python format
python-format:
  stage: code-linting
  image: alpine:latest
  rules:
    # Always run when a pipeline is started manually from the web UI.
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # Otherwise only run when Python files or their formatting config change.
    - changes:
        - "**/*.py"
        - "**/pyproject.toml"
  before_script:
    - apk update
    - apk add git python3
    - python3 -m venv .venv
    - source ./.venv/bin/activate
    - pip install black isort
  script:
    - black --check .
    - isort --check .
  timeout: 1h

# Spell checking
spell-check:
  stage: code-linting
  image: alpine:latest
  before_script:
    - apk update
    - apk add git python3
    - python3 -m venv .venv
    - source ./.venv/bin/activate
    # Python <3.11 also requires the 'tomli' package
    - pip install codespell
  script:
    # Get commit messages
    - if (git remote | grep -qw upstream) ; then
      git remote remove upstream ;
      fi
    - git remote add -t $CI_DEFAULT_BRANCH --no-tags -f upstream https://gitlab.com/cttc-lena/nr.git

    - git log --pretty=%B HEAD...upstream/$CI_DEFAULT_BRANCH ^upstream/$CI_DEFAULT_BRANCH > git_messages.txt
    # Check source code and commit messages
    - codespell -f -C0 ./
  timeout: 1h

# Cyclomatic complexity and duplicate-block gate (lizard).
#
# The baseline is computed on the fly from a fresh checkout of the upstream
# default branch ($CI_DEFAULT_BRANCH, i.e. master): there are no magic numbers
# to maintain. The job fails only when the change raises the maximum
# cyclomatic complexity or the number of duplicate code blocks above what that
# branch already has. Duplicate blocks are only counted when they involve a
# file the change actually touches, so pre-existing duplication elsewhere in
# the module never blocks an unrelated MR. See
# tools/lizard/check-complexity.py for details.
complexity:
  stage: code-linting
  image: alpine:latest
  rules:
    # Run in every merge-request pipeline whose changes (against the MR
    # target branch) touch C++ sources.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.cc"
        - "**/*.h"
        - "**/*.hpp"
    # Always run when a pipeline is started manually from the web UI.
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # Branch pipelines: only run when C++ sources change.
    - changes:
        - "**/*.cc"
        - "**/*.h"
        - "**/*.hpp"
    # Any other pipeline: offer the job as an optional manual run that does
    # not block the pipeline while waiting to be started.
    - when: manual
      allow_failure: true
  before_script:
    - apk update
    - apk add git python3
    - python3 -m venv .venv
    - source ./.venv/bin/activate
    - pip install lizard==1.23.0
  script:
    # Clone the upstream default branch once and reuse it as the baseline so we
    # don't pay for a second clone inside the script.
    - git clone --depth=1 --branch $CI_DEFAULT_BRANCH https://gitlab.com/cttc-lena/nr.git nr-baseline
    - ./tools/lizard/check-complexity.py --baseline-dir nr-baseline
    - rm -rf nr-baseline
  timeout: 1h
  interruptible: true

# Clang-tidy
clang-tidy-19:
  stage: code-linting
  image: ubuntu:latest
  rules:
    - changes:
        - "**/*.cc"
        - "**/*.h"
    - when: manual
      allow_failure: true
  before_script:
    - apt update
    - DEBIAN_FRONTEND=noninteractive apt install -y
      clang cmake
      clang-tidy clang-tidy-19
      git libsqlite3-dev libeigen3-dev
  script:
    - git clone -b $NS3_RELEASE_VERSION --depth=1 $NS3_REPOSITORY_URL
    - ln -s ${PWD} ns-3-dev/contrib/nr
    - pushd ns-3-dev
    - ./ns3 configure -d debug --enable-examples --enable-tests --enable-asserts --disable-precompiled-headers
    - echo "Trimming compile_commands.json to filter out non-nr code"
    - ./contrib/nr/tools/trim_compile_commands.py ./cmake-cache/compile_commands.json
    - echo "Running full clang-tidy for nr"
    - run-clang-tidy-19 -p cmake-cache/ -quiet 1> ../clang-tidy-output.log 2> /dev/null
    # Check job results
    - (! egrep -v "file not found \[clang-diagnostic-error\]" ../clang-tidy-output.log | egrep -A3 "error:|warning:|note:")
    - echo "No clang-tidy errors found"
    - popd
    - rm -rf ns-3-dev
  dependencies: []
  artifacts:
    paths:
      - clang-tidy-output.log
    when: on_failure
  interruptible: true
  timeout: 3h

# Check commit format and style
check-commit-message:
  stage: code-linting
  image: alpine:latest
  before_script:
    - apk update
    - apk add git python3
    - python3 -m venv .venv
    - source ./.venv/bin/activate
    - pip install GitPython
  script:
    # Check source code and commit messages
    - ./tools/check-commit-message/check-commit-message.py
  timeout: 1h
  allow_failure: true

# Check for emacs line presence
emacs-line:
  stage: code-linting
  image: alpine:latest
  before_script:
    - apk update
    - apk add grep
  script:
    - if ( egrep -rn --include="*.h" --include="*.cc" --include="*.c" --include="*.py" --include="*.rst" "c-file-style:|py-indent-offset:" ) ; then
      echo "Found Emacs lines on the above C/C++, Python and RST files" ;
      exit 1 ;
      else
      echo "No Emacs lines found on C/C++, Python and RST files" ;
      exit 0 ;
      fi
  timeout: 1h
  interruptible: true

# Check for header module include in module sources
header-module-include:
  stage: code-linting
  image: alpine:latest
  before_script:
    - apk update
    - apk add grep
  script:
    - if ( egrep -rn --include="*.h" --include="*.cc" "#include \"ns3/nr-module.h\"" ./model ./helper ./utils ) ; then
      echo "Found nr-module.h includes on the above nr module source files. Replace with actual nr headers." ;
      exit 1 ;
      else
      echo "No incorrect use of nr-module.h header found. Keep up with the good work :)" ;
      exit 0 ;
      fi
  timeout: 1h
  interruptible: true

# Check for dead urls
check-dead-urls:
  stage: code-linting
  image: alpine:latest
  before_script:
    - apk update
    - apk add git python3
    - python3 -m venv .venv
    - source ./.venv/bin/activate
    - pip install httpx[http2]
  script:
    - echo 'nameserver 1.1.1.1' > /etc/resolv.conf
    - ./tools/check-dead-urls.py ./
  timeout: 1h
  allow_failure: true
